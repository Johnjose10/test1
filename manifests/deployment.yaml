```yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: test1-deployment
  namespace: production
  labels:
    app: test1
    tier: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: test1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: test1
        tier: frontend

    spec:
      containers:
        - name: test1
          image: docker777john/test1:4
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

      restartPolicy: Always
```